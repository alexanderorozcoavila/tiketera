{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col s12 m6 offset-m3">
        <div class="card" style="margin-top: 50px;">
            <div class="card-content">
                <span class="card-title center-align">Cambio de Contraseña</span>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="center-align" style="margin-top: 20px;">
                        <button class="btn waves-effect waves-light blue" type="submit">
                            Confirmar Cambio <i class="material-icons right">lock</i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
