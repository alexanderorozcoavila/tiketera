{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col s12 m8 offset-m2 l6 offset-l3">
        <div class="card">
            <div class="card-content">
                <span class="card-title">Confirmar Compra</span>
                <p>Estás a punto de comprar un boleto para <b>{{ ticket_type.event.title }}</b>.</p>
                <ul>
                    <li><b>Tipo de Boleto:</b> {{ ticket_type.name }}</li>
                    <li><b>Precio:</b> ${{ ticket_type.price }}</li>
                </ul>
                <br>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn green waves-effect waves-light w-100">
                        Confirmar y Pagar
                        <i class="material-icons right">payment</i>
                    </button>
                    <a href="{% url 'event_detail' ticket_type.event.id %}" class="btn grey right">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
