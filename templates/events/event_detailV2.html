{% extends 'baseV2.html' %}
{% load static %}
{% block content %}
<picture class="bg-image">
  <img src="{% static 'ticketera/img/nocheEstrellada.png' %}" alt="Fondo" draggable="false">
</picture>

<div class="container" style="max-width:950px; margin:60px auto; position: relative; z-index: 10;">
    
    <div style="margin-bottom: 20px; display: flex; align-items: center;">
        <a href="{% url 'event_listV2' %}" class="btn-back-glass">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Volver a eventos
        </a>
    </div>

    <div class="info-card-stage" style="border-radius: 16px; overflow: hidden; border: 1px solid rgba(201,168,76,0.2);">
        
        {% if event.image %}
        <div style="height: 420px; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <img src="{{ event.image.url }}" alt="{{ event.title }}" id="eventImage"
                 style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        {% endif %}

        <div style="padding: 40px; background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(12px);">
            <h1 class="hero-title" style="margin-bottom:20px;">{{ event.title }}</h1>
            
            <div style="display:flex; flex-wrap:wrap; gap:30px;">
                <div style="flex:1; min-width:250px;">
                    <p><b>Fecha:</b> {{ event.date_time|date:'d M Y H:i' }}</p>
                    <p><b>Lugar:</b> {{ event.venue.name }} <br>
                       <span class="field-hint">{{ event.venue.address }}</span>
                    </p>
                </div>
                <div style="flex:1; min-width:250px;">
                    <h3 class="section-title">Acerca del Evento</h3>
                    <p class="field-hint">{{ event.description }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const img = document.getElementById('eventImage');
        
        function updateStage() {
            document.body.classList.add('event-detail-active');
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = 1; canvas.height = 1;
            ctx.drawImage(img, 0, 0, 1, 1);
            const [r, g, b] = ctx.getImageData(0, 0, 1, 1).data;
            document.documentElement.style.setProperty('--glow-color', `rgb(${r},${g},${b})`);
        }

        if (img && img.complete) updateStage();
        else if (img) img.addEventListener('load', updateStage);
    });
</script>
{% endblock %}
