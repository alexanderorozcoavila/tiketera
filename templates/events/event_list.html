{% extends 'base.html' %}
{% block content %}
<h3 class="center-align">Próximos Eventos</h3>
<div class="row">
    {% for event in events %}
    <div class="col s12 m6 l4">
        <div class="card hoverable">
            <div class="card-image blue lighten-2 white-text center-align" style="padding: 40px 0;">
                <i class="material-icons" style="font-size: 60px;">event</i>
            </div>
            <div class="card-content">
                <span class="card-title truncate"><b>{{ event.title }}</b></span>
                <p><i class="material-icons tiny">date_range</i> {{ event.date_time|date:'d M Y H:i' }}</p>
                <p><i class="material-icons tiny">place</i> {{ event.venue.name }}</p>
            </div>
            <div class="card-action center-align">
                <a href="{% url 'event_detail' event.id %}" class="btn blue darken-2">Ver Detalles</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col s12 center-align">
        <p class="grey-text">No hay eventos publicados por ahora.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
