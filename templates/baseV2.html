{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}FastiTicket{% endblock %}</title>
    <link rel="icon" href="{% static 'ticketera/img/logo.ico' %}">
    <!-- Fuentes -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <header>
    <a class="logo" href="{% url 'event_listV2' %}">
        <img src="{% static 'ticketera/img/logo.png' %}" 
            alt="FastiTicket Logo" 
            class="logo-img">

        <div class="logo-texts">
            <span class="logo-title">FastiTicket</span>
            <span class="logo-subtitle">
            ✦ CHILE 
            <img src="https://flagcdn.com/w20/cl.png" 
                alt="CL" 
                class="cl-flag">
            ✦
        </span>
        </div>
    </a>

    <div class="header-right">
        <a href="{% url 'my_ticketsV2' %}" class="btn-rhomboid">Mis tickets</a>
        <a href="{% url 'login' %}" class="btn-rhomboid btn-rhomboid-right">Ingresar</a>
    </div>
</header>

    <style>
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .logo-img {
            width: 82px;
            height: auto;
            object-fit: contain;

            filter:
                drop-shadow(0 0 8px rgba(212,175,55,0.25))
                drop-shadow(0 0 12px rgba(0,0,0,0.45));

            transition: transform 0.25s ease;
        }

        .logo:hover .logo-img {
            transform: scale(1.04);
        }

        .logo-texts {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1;
        }

        .logo-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;

            color: #d4af37;

            text-shadow:
                0 0 8px rgba(212,175,55,0.18),
                0 0 18px rgba(212,175,55,0.08);
        }

        .logo-subtitle {
            margin-top: 6px;

            font-family: 'Lato', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;

            letter-spacing: 4px;

            color: #c59b47;

            opacity: 0.95;
        }

        :root {
        --gold: #c9a84c;
        --gold-light: #e8c97a;
        --gold-dark: #8a6a1f;
        --cream: #f5efe0;
        --dark: #0a0a0f;
        --dark2: #12111a;
        --dark3: #1c1b28;
        --snow: #e8eff5;
        --ice: #a8c8e8;
        --stone: #6b5e4e;
        --ember: #c4623a;
        --text-muted: rgba(245,239,224,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
        font-family: 'Lato', sans-serif;
        background: var(--dark);
        color: var(--cream);
        overflow-x: hidden;
        min-height: 100vh;
        }

        /* ─── OVERLAY ─── */
        .page-overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: linear-gradient(
            180deg,
            rgba(5,8,16,0.7) 0%,
            rgba(10,10,20,0.4) 40%,
            rgba(10,10,20,0.75) 100%
        );
        pointer-events: none;
        }

        /* ─── HEADER ─── */
        header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px;
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(5,8,16,0.85);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(201,168,76,0.2);
        }
        .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Cinzel', serif;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: var(--gold-light);
        text-decoration: none;
        }
        .logo-icon {
        width: 32px; height: 32px;
        background: linear-gradient(135deg, #d52b1e 50%, #003087 50%);
        border-radius: 6px;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px;
        box-shadow: 0 2px 12px rgba(201,168,76,0.3);
        }
        .header-right {
        display: flex; align-items: center; gap: 14px;
        }
        /* ─── SE CREO NUEVA VARIANTE DE NAV-BTN-ABAJO DE ESTE MISMO
        .nav-btn {
        background: none;
        border: 1px solid rgba(201,168,76,0.3);
        color: var(--gold-light);
        padding: 7px 16px;
        border-radius: 20px;
        font-family: 'Lato', sans-serif;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.3s;
        }
        .nav-btn:hover { background: rgba(201,168,76,0.15); border-color: var(--gold); }
        ─── */
        /* ─── NAV BTN Romboide ─── */
        .btn-rhomboid {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: var(--dark);
            border: none;
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
            transform: skewX(-20deg);
            position: relative;
        }

        .btn-rhomboid span {
            display: inline-block;
            transform: skewX(20deg); /* corrige el texto */
        }

        .btn-rhomboid-left {
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
        }

        .btn-rhomboid-right {
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            margin-left: -5px; /* une ambos botones sin espacio */
        }

        .btn-rhomboid:hover {
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            transform: skewX(-20deg) translateY(-2px);
            box-shadow: 0 6px 20px rgba(201,168,76,0.4);
        }

        /*BTN RETROCEDER EVENT*/
        .btn-back-glass {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            padding: 10px 18px;
            border-radius: 10px;

            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(6px);

            border: 1px solid rgba(201,168,76,0.35);
            color: var(--gold);

            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;

            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        /* Flecha */
        .btn-back-glass svg {
            width: 16px;
            height: 16px;
            transition: transform 0.25s ease;
        }

        /* Hover */
        .btn-back-glass:hover {
            background: rgba(15, 15, 15, 0.9);
            border-color: var(--gold);
            box-shadow: 0 6px 20px rgba(201,168,76,0.25);
        }

        /* Animación flecha */
        .btn-back-glass:hover svg {
            transform: translateX(-5px);
        }
        
        /* ─── PAGE 1: EVENTS ─── */
        .hero-section {
        padding: 60px 24px 20px;
        text-align: center;
        }

        .hero-image { /* nuevo hero con imagen */
            position: relative;
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        /* Partículas del Hero */
        #hero-particle-container {
            position: absolute;
            inset: 0;
            pointer-events: none; /* No interfiere con clics en el buscador */
            z-index: 1; 
        }

        .hero-particle {
            position: absolute;
            background: var(--glow-color, #ffffff);
            border-radius: 50%;
            filter: blur(1.2px);
            box-shadow: 0 0 10px var(--glow-color, rgba(255,255,255,0.4));
            opacity: 0;
        }

        @keyframes heroSnowfall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 0; }
            20% { opacity: 0.5; }
            80% { opacity: 0.5; }
            100% { transform: translateY(70vh) translateX(40px); opacity: 0; }
        }

        /* Aseguramos que tu contenido esté sobre las partículas */
        .hero-image-content {
            position: relative;
            z-index: 2;
        }
        .hero-image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .hero-image-content {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .hero-image img {
                object-position: center bottom;
            }
        }
        

       .hero-tag {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            color: var(--gold-light); /* Cambiado a light para más brillo */
            border: 1px solid rgba(201, 168, 76, 0.5); /* Borde un poco más sólido */
            padding: 6px 18px;
            border-radius: 20px;
            margin-bottom: 18px;
            text-transform: uppercase;
            
            background: rgba(10, 10, 15, 0.6); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(201, 168, 76, 0.1);
        }

        .hero-title {
        font-family: 'Playfair Display', serif;
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-weight: 900;
        line-height: 1.1;
        color: var(--cream);
        text-shadow: 0 0 60px rgba(201,168,76,0.3);
        margin-bottom: 10px;
        }
        .hero-title em {
        font-style: italic;
        color: var(--gold-light);
        }
        .hero-sub {
        font-size: 0.85rem;
        color: var(--text-muted);
        letter-spacing: 0.1em;
        margin-bottom: 30px;
        }

        /* SEARCH */
        .search-wrap {
        max-width: 480px;
        margin: 0 auto 40px;
        position: relative;
        }
        .search-wrap input {
        width: 100%;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(201,168,76,0.3);
        border-radius: 50px;
        padding: 13px 50px 13px 22px;
        color: var(--cream);
        font-family: 'Lato', sans-serif;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.3s;
        backdrop-filter: blur(10px);
        }
        .search-wrap input::placeholder { color: rgba(245,239,224,0.35); }
        .search-wrap input:focus { border-color: var(--gold); box-shadow: 0 0 20px rgba(201,168,76,0.15); }
        .search-btn {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        background: var(--gold);
        border: none; cursor: pointer;
        width: 36px; height: 36px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        color: var(--dark); font-size: 14px;
        transition: all 0.3s;
        }
        .search-btn:hover { background: var(--gold-light); transform: translateY(-50%) scale(1.05); }
        /* Transiciones para el filtrado suave */
        .featured-wrap, .carousel, .section-header, .upcoming-item {
            transition: opacity 0.4s ease, transform 0.4s ease;
            will-change: opacity, transform;
        }

        /* Opcional: un efecto de hover extra para tus resultados filtrados */
        .upcoming-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* SECTION TITLE */
        .section-header {
        display: flex; align-items: center; gap: 14px;
        padding: 0 24px;
        margin-bottom: 18px;
        }
        .section-title {
        font-family: 'Cinzel', serif;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        color: var(--gold);
        text-transform: uppercase;
        }
        .section-line {
        flex: 1; height: 1px;
        background: linear-gradient(90deg, rgba(201,168,76,0.4), transparent);
        }

        /* ─── CAROUSEL: FIX COMPLETO ─── */
        .carousel {
            position: relative;
            padding: 100px 0;
            overflow: hidden;
            perspective: 1000px;

            /* 🔥 FIX: evita selección */
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        /* CONTENEDOR */
        .carousel-track {
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;

            /* 🔥 FIX MOBILE */
            touch-action: pan-y;

            /* UX */
            cursor: grab;
        }

        .carousel-track:active {
            cursor: grabbing;
        }

        /* ITEMS */
        .carousel-item {
            width: 200px;
            height: 300px;
            border-radius: 16px;
            overflow: visible;
            position: relative;
            cursor: grab;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.2;
            transform: scale(0.7);
            z-index: 1;
            --glow-color: rgba(201, 168, 76, 1);
        }

        /*  FIX: imagen no draggable */
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 35%;
            border-radius: 16px;
            transition: filter 0.5s ease;

                user-select: none;
                -webkit-user-drag: none;
        }

        /* ACTIVE */
        .carousel-item.active {
            transform: scale(1.35);
            opacity: 1;
            z-index: 10;
            box-shadow: 
                0 0 25px 2px var(--glow-color),
                0 0 50px 10px rgba(0,0,0,0.6);
        }

        /* SIDE */
        .carousel-item.side {
            transform: scale(1);
            opacity: 0.6;
            z-index: 5;
        }

        /* GLOW */
        .carousel-item.active::before {
            content: "";
            position: absolute;
            inset: -15px; 
            border-radius: 25px;
            background: var(--glow-color);
            filter: blur(40px);
            opacity: 0.8;
            z-index: -1;
        }

        /* INFO */
        .carousel-info {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 15px 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-size: 0.85rem;
            color: white;
            border-radius: 0 0 16px 16px;
            text-align: center;

            /* 🔥 FIX: no seleccionar texto */
            user-select: none;
        }

        /* BOTONES */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            
            background: rgba(10, 10, 15, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            border: 1px solid rgba(201, 168, 76, 0.4);
            color: var(--gold-light);
            
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-btn:hover {
            background: var(--gold);
            color: var(--dark);
            border-color: var(--gold-light);
            box-shadow: 0 0 25px rgba(201, 168, 76, 0.5);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-btn.left { left: 20px; }
        .carousel-btn.right { right: 20px; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .carousel { padding: 60px 0; }

            .carousel-item {
                width: 150px;
                height: 230px;
            }

            .carousel-item.active {
                transform: scale(1.2);
            }
        }

        /* FONDO DE VISTA event_detailV2 */
        .bg-image {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .bg-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            filter: 
                brightness(0.75)   /* apenas oscurece */
                saturate(0.85);    /* baja un poco el color */
        }

        .bg-image::after {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(10, 10, 15, 0.25);
        }

        /* overlay para que combine con tu diseño */
        .hero-image::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        width: 100%;
        height: 120px;
        background: linear-gradient(
            to bottom,
            rgba(5,8,16,0) 0%,
            rgba(5,8,16,0.9) 100%
        );
    }

        .event-card {
        flex: 0 0 220px;
        border-radius: 16px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(.2,.8,.4,1), box-shadow 0.35s;
        border: 1px solid rgba(201,168,76,0.15);
        }
        .event-card:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(201,168,76,0.12);
        }
        .event-poster {
        width: 100%; height: 300px;
        object-fit: cover;
        display: block;
        }
        .event-poster-placeholder {
        width: 100%; height: 300px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: 'Playfair Display', serif;
        font-size: 1.6rem;
        font-weight: 900;
        color: var(--cream);
        text-align: center;
        text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        padding: 20px;
        line-height: 1.15;
        }
        .card-info {
        position: absolute; bottom: 0; left: 0; right: 0;
        background: linear-gradient(transparent, rgba(5,8,16,0.95));
        padding: 40px 14px 14px;
        }
        .card-artist {
        font-family: 'Playfair Display', serif;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--cream);
        }
        .card-venue {
        font-size: 0.72rem;
        color: var(--gold-light);
        margin: 3px 0;
        display: flex; align-items: center; gap: 4px;
        }
        .card-date {
        font-size: 0.7rem;
        color: var(--text-muted);
        display: flex; align-items: center; gap: 4px;
        }
        .badge-hot {
        position: absolute; top: 12px; right: 12px;
        background: var(--ember);
        color: #fff;
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        border-radius: 10px;
        text-transform: uppercase;
        }
        .badge-new {
        position: absolute; top: 12px; right: 12px;
        background: var(--gold-dark);
        color: var(--cream);
        font-size: 0.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 3px 9px;
        border-radius: 10px;
        text-transform: uppercase;
        }

        /* FEATURED EVENT */
        .featured-wrap {
        margin: 30px 24px 20px;
        }
        .featured-card {
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        cursor: pointer;
        border: 1px solid rgba(201,168,76,0.25);
        transition: transform 0.3s;
        }
        .featured-card:hover { transform: scale(1.01); }
        .featured-bg {
        height: 200px;
        background: linear-gradient(135deg, #1a0a05 0%, #2a1a0a 50%, #0a1525 100%);
        position: relative;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        }
        .featured-bg::before {
        content: '';
        position: absolute; inset: 0;
        background: radial-gradient(ellipse at center, rgba(201,168,76,0.15), transparent 70%);
        }
        .featured-artist-name {
        font-family: 'Cinzel', serif;
        font-size: 2.8rem;
        font-weight: 700;
        color: var(--gold-light);
        text-shadow: 0 0 40px rgba(201,168,76,0.5);
        z-index: 1;
        text-align: center;
        letter-spacing: 0.05em;
        }
        .featured-info {
        background: rgba(10,10,20,0.92);
        padding: 16px 18px;
        display: flex; justify-content: space-between; align-items: center;
        backdrop-filter: blur(10px);
        }
        .featured-details h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.15rem;
        color: var(--cream);
        }
        .featured-details p {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 3px;
        }
        .btn-tickets {
        background: linear-gradient(135deg, var(--gold-dark), var(--gold));
        color: var(--dark);
        border: none;
        padding: 10px 20px;
        border-radius: 50px;
        font-family: 'Cinzel', serif;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        cursor: pointer;
        transition: all 0.3s;
        white-space: nowrap;
        }
        .btn-tickets:hover {
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(201,168,76,0.4);
        }

        /* UPCOMING LIST */
        .upcoming-list {
        padding: 0 24px;
        display: flex; flex-direction: column; gap: 12px;
        margin-bottom: 80px;
        }
        .upcoming-item {
        display: flex; align-items: center; gap: 14px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(201,168,76,0.12);
        border-radius: 14px;
        padding: 14px;
        cursor: pointer;
        transition: all 0.3s;
        }
        .upcoming-item:hover {
        background: rgba(201,168,76,0.08);
        border-color: rgba(201,168,76,0.3);
        transform: translateX(4px);
        }
        .upcoming-date-box {
        background: linear-gradient(135deg, rgba(201,168,76,0.2), rgba(201,168,76,0.05));
        border: 1px solid rgba(201,168,76,0.3);
        border-radius: 10px;
        width: 50px; min-width: 50px; height: 54px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: 'Cinzel', serif;
        }
        .upcoming-day { font-size: 1.3rem; font-weight: 700; color: var(--gold-light); line-height: 1; }
        .upcoming-month { font-size: 0.6rem; color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
        .upcoming-body { flex: 1; }
