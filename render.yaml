databases:
  - name: tiketera-db
    plan: free

services:
  - type: web
    name: tiketera
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn tiketera.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.9"
      - key: DATABASE_URL
        fromDatabase:
          name: tiketera-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "localhost, 127.0.0.1, tiketera-xxxx.onrender.com"  # Render will let you change this dynamically
