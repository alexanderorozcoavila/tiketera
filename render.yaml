databases:
  - name: tiketera-db
    plan: free

services:
  - type: web
    name: tiketera
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_db
    startCommand: gunicorn tiketera.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.9.18"
      - key: DATABASE_URL
        fromDatabase:
          name: tiketera-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
